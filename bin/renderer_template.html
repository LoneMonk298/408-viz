<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>408-Viz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: transparent;
  --card: #ffffff;
  --primary: #2f9e44;
  --primary-d: #2b8a3e;
  --primary-soft: #d3f9d8;
  --text: #343a40;
  --text-2: #868e96;
  --border: #e9ecef;
  --shadow: 0 2px 10px rgba(0,0,0,0.07);
  --radius: 10px;
  --success: #40c057;
  --warning: #fab005;
  --danger:  #fa5252;
  --info:    #228be6;
  --purple:  #be4bdb;
}
html.dark {
  --card: #1e1e20;
  --bg: #141518;
  --text: #e9ecef;
  --text-2: #adb5bd;
  --border: #3a3d44;
  --shadow: 0 2px 10px rgba(0,0,0,0.3);
  --primary-soft: rgba(47,158,68,0.2);
}
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
/* ===== Toolbar ===== */
.toolbar {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px 14px;
  padding: 8px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 2;
}
.toolbar__title {
  font-weight: 700; font-size: 14px;
  color: var(--primary); white-space: nowrap;
}
.select {
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 13px;
  background: var(--card);
  color: var(--text);
  max-width: 260px;
  cursor: pointer;
}
.ctrl-group { display: flex; gap: 8px; align-items: center; }
.ctrl-btn {
  border: none;
  width: 36px; height: 36px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: var(--border);
  color: var(--text);
}
.ctrl-btn:hover:not(:disabled) { opacity: 0.85; }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ctrl-btn.play {
  background: var(--primary);
  color: #fff;
  width: 44px; height: 36px;
  font-size: 14px;
}
.ctrl-btn.play:hover { background: var(--primary-d); }
.speed-control {
  display: flex; align-items: center; gap: 6px; margin-left: 6px;
}
.speed-control label {
  font-size: 12px; color: var(--text-2); white-space: nowrap;
}
.speed-control input[type=range] { width: 80px; cursor: pointer; }
.speed-val {
  font-size: 11px; color: var(--text-2); min-width: 28px;
}
/* ===== Stage ===== */
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
#canvas {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  display: block;
}
/* ===== Legend ===== */
.legend-float {
  position: absolute;
  top: 8px; right: 8px;
  background: color-mix(in srgb, var(--card) 85%, transparent);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  max-width: 60%;
  z-index: 3;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
  color: var(--text);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--primary-soft);
  border: 2px solid var(--primary);
  display: inline-block;
}
/* ===== Step overlay ===== */
.step-overlay {
  position: absolute;
  left: 14px; right: 14px; bottom: 14px;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  z-index: 3;
}
.step-overlay__num {
  display: inline-block;
  background: var(--success);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-overlay__body {
  flex: 1;
  min-width: 0;
}
.step-overlay__title {
  font-weight: 700;
  margin-bottom: 2px;
}
.step-overlay__desc {
  color: var(--text-2);
  line-height: 1.5;
  word-break: break-word;
}
.step-overlay__desc code {
  background: var(--primary-soft);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  color: var(--primary-d);
}
.step-overlay__desc .code {
  background: var(--primary-soft);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  color: var(--primary-d);
}
/* mobile */
@media (max-width: 640px) {
  .step-overlay { font-size: 12px; padding: 8px 10px; }
  .legend-float { font-size: 10px; padding: 4px 6px; gap: 6px; max-width: 90%; }
  .toolbar { padding: 6px 10px; gap: 6px 10px; }
  .toolbar__title { font-size: 13px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar__title" id="title">408-Viz</div>
  <select id="presetSelect" class="select"></select>
  <div class="ctrl-group">
    <button class="ctrl-btn" id="resetBtn" title="重置 (R)">&#8634;</button>
    <button class="ctrl-btn" id="prevBtn" title="上一步 (←)">&#9664;</button>
    <button class="ctrl-btn play" id="playBtn" title="播放/暂停 (空格)">&#9654;</button>
    <button class="ctrl-btn" id="nextBtn" title="下一步 (→)">&#9654;</button>
    <div class="speed-control">
      <label>速度</label>
      <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.5" value="0.5">
      <span class="speed-val" id="speedValue">0.5x</span>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="canvas"></canvas>
  <div class="legend-float" id="legend"></div>
  <div class="step-overlay" id="stepOverlay">
    <span class="step-overlay__num" id="overlayNum"></span>
    <div class="step-overlay__body">
      <div class="step-overlay__title" id="overlayTitle"></div>
      <div class="step-overlay__desc" id="overlayDesc"></div>
    </div>
  </div>
</div>

<script>
// ===== IR 数据（由 render.py 注入）=====
const IR = /*__IR__*/null;

// ===== 通用工具 =====
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// 主题判定：只检查 .dark 类
function isDark() {
  return document.documentElement.classList.contains('dark');
}

// 父组件主题同步消息
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'viz-theme') {
    document.documentElement.classList.toggle('dark', !!e.data.dark);
  }
});
// 初始系统偏好兜底
if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}

// ===== 颜色配置（高亮 kind → 颜色）=====
const HL_COLORS = {
  insert:    { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.18)' },
  visit:     { fill: '#228be6', stroke: '#1c7ed6', fillSoft: 'rgba(34,139,230,0.18)' },
  compare:   { fill: '#f59f00', stroke: '#e8590c', fillSoft: 'rgba(245,159,0,0.18)' },
  unbalanced:{ fill: '#fab005', stroke: '#f59f00', fillSoft: 'rgba(250,176,5,0.25)' },
  rotated:   { fill: '#be4bdb', stroke: '#9c36b5', fillSoft: 'rgba(190,75,219,0.18)' },
  removed:   { fill: '#fa5252', stroke: '#e03131', fillSoft: 'rgba(250,82,82,0.22)' },
};
const LEGEND = {
  insert:    '新插入',
  visit:     '查找路径',
  compare:   '比较',
  unbalanced:'失衡根',
  rotated:   '旋转结点',
  removed:   '摘出结点',
};

// ===== 状态 =====
const S = {
  steps: [],
  currentStep: -1,
  playing: false,
  timer: null,
  speed: 0.5,
  presetIdx: 0,
  display: {},   // 节点动画显示状态
  treePos: {},   // 目标布局位置
};

// ===== URL 参数 =====
function getUrlParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    preset: p.has('preset') ? parseInt(p.get('preset'), 10) : null,
    autoplay: p.has('autoplay') ? p.get('autoplay') === '1' : true,
    speed: p.has('speed') ? parseFloat(p.get('speed')) : null,
    hidelegend: p.get('hidelegend') === '1',
  };
}

// ===== Canvas 准备 =====
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(r.width * dpr));
  canvas.height = Math.max(1, Math.floor(r.height * dpr));
}
window.addEventListener('resize', () => { resizeCanvas(); draw(0); });

// ===== 布局：树（tidy 布局：叶子占单位槽位，内部节点取子节点范围中点，整体居中）=====
function computeTreeLayout(root, w, h) {
  if (!root) return { nodes: [], layerGap: 0, r: 16 };
  const insetL = 60, insetR = 60, topPad = 70, bottomPad = 100;
  const availW = Math.max(100, w - insetL - insetR);
  const availH = Math.max(120, h - topPad - bottomPad);
  // 自底向上分配槽位：叶子依次 0,1,2...；内部节点 = 首末子节点槽位中点
  const slot = {}, depth = {};
  let nextSlot = 0, maxDepth = 0;
  (function walk(n, d) {
    if (!n) return;
    depth[n.id] = d;
    if (d > maxDepth) maxDepth = d;
    const kids = (n.children || []).filter(Boolean);
    if (!kids.length) {
      slot[n.id] = nextSlot++;
      return;
    }
    kids.forEach(c => walk(c, d + 1));
    slot[n.id] = (slot[kids[0].id] + slot[kids[kids.length - 1].id]) / 2;
  })(root, 0);
  // 槽位间距：撑满可用宽度，但小树不过度拉伸（上限 150px）
  const spanX = Math.max(0, nextSlot - 1);
  const sx = spanX === 0 ? 150 : Math.min(availW / spanX, 150);
  const x0 = insetL + (availW - spanX * sx) / 2;
  // 半径随间距缩放，保证相邻节点不重叠
  const r = Math.max(10, Math.min(clamp(sx * 0.3, 14, 22), (sx - 10) / 2));
  // 层间距：撑满可用高度，上限 120px、下限 2r+12（防深树垂直重叠）；浅树垂直居中
  const layerGap = maxDepth === 0 ? 0 : clamp(availH / maxDepth, 2 * r + 12, 120);
  const y0 = topPad + (availH - maxDepth * layerGap) / 2;
  const nodes = [];
  (function collect(n) {
    if (!n) return;
    nodes.push({
      id: n.id, val: n.val,
      x: x0 + slot[n.id] * sx,
      y: y0 + depth[n.id] * layerGap,
      r: r,
      children: (n.children || []).filter(Boolean).map(c => c.id),
    });
    (n.children || []).forEach(collect);
  })(root);
  return { nodes, layerGap, r };
}

// ===== 布局：FSM（col 决定列，列内均匀分布，整组在可用区域居中）=====
function computeFSMLayout(states, w, h) {
  const insetL = 80, insetR = 80, topPad = 60, bottomPad = 100;
  const availW = Math.max(120, w - insetL - insetR);
  const availH = Math.max(160, h - topPad - bottomPad);
  const cols = {};
  states.forEach(s => { (cols[s.col] = cols[s.col] || []).push(s); });
  const colKeys = Object.keys(cols).map(Number).sort((a, b) => a - b);
  const colCount = colKeys.length;
  const r = 34;
  // 可用区域在垂直方向进一步收缩 r + 12（给 sublabel 留位）
  const effTop = topPad + r + 12;
  const effBottom = h - bottomPad;
  const nodes = [];
  colKeys.forEach((col, i) => {
    const xs = colCount === 1
      ? insetL + availW / 2
      : insetL + availW * (i / (colCount - 1));
    const items = cols[col];
    const itemGap = items.length === 1 ? 0 : (effBottom - effTop) / (items.length - 1);
    items.forEach((s, row) => {
      nodes.push({
        id: s.id, type: s.type, label: s.label, sublabel: s.sublabel,
        x: xs,
        y: items.length === 1
          ? (effTop + effBottom) / 2
          : effTop + row * itemGap,
        r: r,
      });
    });
  });
  return { nodes, r };
}

// ===== 应用步骤 =====
function applyStep(idx) {
  if (idx < 0 || idx >= S.steps.length) return;
  S.currentStep = idx;
  const st = S.steps[idx];
  // 字幕
  $('overlayNum').textContent = `步骤 ${idx+1}/${S.steps.length}`;
  $('overlayTitle').textContent = st.title;
  // 允许在 desc 中用 <code>xxx</code>
  $('overlayDesc').innerHTML = (st.desc || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  // 按钮状态
  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = idx === S.steps.length - 1;
  // 树布局
  S.treePos = {};
  if (IR.struct_type === 'tree') {
    const r = canvas.getBoundingClientRect();
    const lay = computeTreeLayout(st.tree, r.width, r.height);
    S.layout = lay;
    // 初始化 display 状态
    lay.nodes.forEach(n => {
      const d = S.display[n.id];
      if (d) {
        d.tx = n.x; d.ty = n.y; d.tval = n.val; d.ta = 1; d.tr = n.r;
      } else {
        S.display[n.id] = {
          x: n.x, y: n.y, a: 0, tx: n.x, ty: n.y, ta: 1,
          val: n.val, tval: n.val, r: n.r, tr: n.r,
        };
      }
    });
    // 高亮
    S.hl = {};
    (st.hl || []).forEach(h => { S.hl[h.node_id] = h.kind; });
  } else if (IR.struct_type === 'fsm') {
    const r = canvas.getBoundingClientRect();
    const lay = computeFSMLayout(IR.states, r.width, r.height);
    S.layout = lay;
    // 初始化 display
    lay.nodes.forEach(n => {
      if (!S.display[n.id]) {
        S.display[n.id] = { x: n.x, y: n.y, a: 0.6, tx: n.x, ty: n.y, ta: 0.6, r: n.r, tr: n.r };
      }
    });
    // 当前 active 高亮
    S.hl = {};
    (st.active || []).forEach(id => { S.hl[id] = 'insert'; });
    S.lastTrans = new Set((st.lastTrans || []).map(t => t.id));
  }
}

// ===== 绘制 =====
function draw(ts) {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  if (!S.layout || !S.steps.length) return;

  // 动画插值
  for (const id in S.display) {
    const d = S.display[id];
    d.x += (d.tx - d.x) * 0.18;
    d.y += (d.ty - d.y) * 0.18;
    d.a += (d.ta - d.a) * 0.22;
    if (d.tr != null) d.r += (d.tr - d.r) * 0.18;
  }

  if (IR.struct_type === 'tree') drawTree(ts);
  else if (IR.struct_type === 'fsm') drawFSM(ts);
}

// ===== 树渲染 =====
function drawTree(ts) {
  const dark = isDark();
  const baseFill = dark ? '#252527' : '#ffffff';
  const baseStroke = dark ? '#5c5f66' : '#c1c6cc';
  const edgeColor = dark ? '#3a3d44' : '#dee2e6';
  const textColor = dark ? '#e9ecef' : '#343a40';
  const nodes = S.layout.nodes;

  // 画边
  ctx.lineWidth = 2;
  nodes.forEach(n => {
    const dn = S.display[n.id];
    if (!dn) return;
    (n.children || []).forEach(cid => {
      const child = S.display[cid];
      if (child) {
        ctx.strokeStyle = edgeColor;
        ctx.beginPath();
        ctx.moveTo(dn.x, dn.y + dn.r);
        ctx.lineTo(child.x, child.y - child.r);
        ctx.stroke();
      }
    });
  });

  // 画节点
  nodes.forEach(n => {
    const d = S.display[n.id];
    if (!d) return;
    let fill = baseFill, stroke = baseStroke, pulse = false;
    const kind = S.hl[n.id];
    if (kind && HL_COLORS[kind]) {
      fill = HL_COLORS[kind].fillSoft;
      stroke = HL_COLORS[kind].stroke;
      pulse = (kind === 'insert' || kind === 'unbalanced' || kind === 'rotated');
    }
    const rr = d.r * (pulse ? (1 + 0.06 * Math.sin(ts / 180)) : 1);
    ctx.save();
    ctx.globalAlpha = clamp(d.a, 0, 1);
    ctx.beginPath();
    ctx.arc(d.x, d.y, rr, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    // 文本
    ctx.fillStyle = textColor;
    ctx.font = `600 ${Math.floor(rr * 0.8)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(n.val), d.x, d.y);
    ctx.restore();
  });
}

// ===== 边绘制辅助 =====
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px-x1)*dx + (py-y1)*dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
}
function drawArrowHead(x, y, ux, uy, hl, edgeColor) {
  const ah = 7;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - ux*ah - uy*ah*0.5, y - uy*ah + ux*ah*0.5);
  ctx.lineTo(x - ux*ah + uy*ah*0.5, y - uy*ah - ux*ah*0.5);
  ctx.closePath();
  ctx.fillStyle = hl ? '#40c057' : edgeColor;
  ctx.fill();
}
function drawEdgeLabel(lbl, x, y, hl, dark, textColor) {
  const w = ctx.measureText(lbl).width + 8;
  ctx.fillStyle = dark ? '#1e1e20' : '#ffffff';
  ctx.fillRect(x - w/2, y - 9, w, 18);
  ctx.fillStyle = hl ? '#40c057' : textColor;
  ctx.fillText(lbl, x, y);
}

// ===== FSM 渲染 =====
function drawFSM(ts) {
  const dark = isDark();
  const textColor = dark ? '#e9ecef' : '#343a40';
  const edgeColor = dark ? '#3a3d44' : '#dee2e6';
  const nodes = S.layout.nodes;

  // 边（直线穿过其他节点时改为弧线绕行，避免遮挡与 label 重叠）
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let bowBelow = 0, bowAbove = 0; // 同向弧线依次错开
  IR.transitions.forEach(tr => {
    const a = nodes.find(n => n.id === tr.from);
    const b = nodes.find(n => n.id === tr.to);
    if (!a || !b) return;
    const hl = S.lastTrans && S.lastTrans.has(tr.id);
    ctx.strokeStyle = hl ? '#40c057' : edgeColor;
    ctx.lineWidth = hl ? 3 : 1.5;
    const lbl = tr.label || '';

    if (a.id === b.id) {
      // 自环：节点上方小弧
      const rho = a.r * 0.6, cy0 = a.y - a.r * 0.8;
      ctx.beginPath();
      ctx.arc(a.x, cy0, rho, Math.PI, Math.PI * 2);
      ctx.stroke();
      drawArrowHead(a.x + rho, cy0, 0, 1, hl, edgeColor);
      if (lbl) drawEdgeLabel(lbl, a.x, cy0 - rho - 12, hl, dark, textColor);
      return;
    }

    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx/dist, uy = dy/dist;
    const x1 = a.x + ux * a.r, y1 = a.y + uy * a.r;
    const x2 = b.x - ux * b.r, y2 = b.y - uy * b.r;
    const blocked = nodes.some(n =>
      n !== a && n !== b &&
      distToSegment(n.x, n.y, a.x, a.y, b.x, b.y) < n.r + 10);

    if (blocked) {
      // 弧线绕行：回退边从下方绕，前跳长边从上方绕
      const below = b.x < a.x;
      let nx = -uy, ny = ux;
      if (ny < 0) { nx = -nx; ny = -ny; } // 法线统一指向下方
      const sign = below ? 1 : -1;
      const bow = clamp(dist * 0.25, 80, 160) + (below ? bowBelow++ : bowAbove++) * 28;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const cx = mx + nx * bow * sign, cy = my + ny * bow * sign;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.stroke();
      // 箭头沿曲线终点切线方向
      let tx = x2 - cx, ty = y2 - cy;
      const tl = Math.hypot(tx, ty) || 1;
      drawArrowHead(x2, y2, tx / tl, ty / tl, hl, edgeColor);
      // label 放贝塞尔中点（弧线最低/最高处）
      if (lbl) drawEdgeLabel(lbl,
        0.25*x1 + 0.5*cx + 0.25*x2, 0.25*y1 + 0.5*cy + 0.25*y2,
        hl, dark, textColor);
    } else {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      drawArrowHead(x2, y2, ux, uy, hl, edgeColor);
      if (lbl) drawEdgeLabel(lbl, (x1 + x2) / 2, (y1 + y2) / 2, hl, dark, textColor);
    }
  });

  // 节点
  nodes.forEach(n => {
    const d = S.display[n.id];
    if (!d) return;
    let fill = dark ? '#252527' : '#ffffff';
    let stroke = dark ? '#5c5f66' : '#c1c6cc';
    const active = S.hl[n.id];
    if (active) {
      fill = HL_COLORS[active].fillSoft;
      stroke = HL_COLORS[active].stroke;
    } else if (n.type === 'start') {
      stroke = '#228be6';
    } else if (n.type === 'success') {
      stroke = '#40c057';
    } else if (n.type === 'failure' || n.type === 'terminal') {
      stroke = '#fa5252';
    }
    ctx.save();
    ctx.globalAlpha = clamp(d.a, 0, 1);
    // 圆
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = active ? 3 : 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    // 标签
    ctx.fillStyle = textColor;
    ctx.font = `600 12px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, d.x, d.y);
    if (n.sublabel) {
      ctx.font = `10px -apple-system, sans-serif`;
      ctx.fillStyle = dark ? '#adb5bd' : '#868e96';
      ctx.fillText(n.sublabel, d.x, d.y + d.r + 14);
    }
    ctx.restore();
  });
}

// ===== 图例 =====
function renderLegend() {
  const legend = $('legend');
  const kinds = Object.keys(LEGEND);
  // tree 显示所有相关 kind；fsm 只显示 insert（active）
  let showKinds = kinds;
  if (IR.struct_type === 'fsm') showKinds = ['insert'];
  legend.innerHTML = showKinds
    .map(k => `<div class="legend-item">
      <span class="legend-dot" style="background:${HL_COLORS[k].fillSoft};border-color:${HL_COLORS[k].stroke}"></span>
      ${LEGEND[k]}
    </div>`).join('');
  if (getUrlParams().hidelegend) legend.style.display = 'none';
}

// ===== 动画主循环 =====
function frame(ts) {
  draw(ts);
  requestAnimationFrame(frame);
}

// ===== 播放控制 =====
function stepDur() { return 1500 / S.speed; }
function play() {
  if (S.playing) return;
  if (S.currentStep >= S.steps.length - 1) applyStep(0);
  S.playing = true;
  $('playBtn').innerHTML = '&#10074;&#10074;';
  tick();
}
function tick() {
  if (!S.playing) return;
  if (S.currentStep >= S.steps.length - 1) { pause(); return; }
  S.timer = setTimeout(() => {
    applyStep(S.currentStep + 1);
    tick();
  }, stepDur());
}
function pause() {
  S.playing = false;
  if (S.timer) { clearTimeout(S.timer); S.timer = null; }
  $('playBtn').innerHTML = '&#9654;';
}
function stepTo(idx) {
  pause();
  applyStep(clamp(idx, 0, S.steps.length - 1));
}

// ===== 加载预设 =====
function loadPreset(idx) {
  pause();
  S.presetIdx = idx;
  S.steps = IR.presets[idx].steps;
  S.currentStep = -1;
  S.display = {};
  applyStep(0);
}

// ===== 初始化 =====
function init() {
  const params = getUrlParams();
  $('title').textContent = IR.meta.title;
  if (IR.meta.caption) {
    $('title').innerHTML += `<span style="font-weight:400;color:var(--text-2);margin-left:8px;font-size:12px">${IR.meta.caption}</span>`;
  }
  // 预设下拉
  const sel = $('presetSelect');
  IR.presets.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => loadPreset(parseInt(e.target.value, 10)));
  // 按钮
  $('resetBtn').onclick = () => { pause(); applyStep(0); };
  $('prevBtn').onclick = () => stepTo(S.currentStep - 1);
  $('nextBtn').onclick = () => stepTo(S.currentStep + 1);
  $('playBtn').onclick = () => S.playing ? pause() : play();
  // 速度
  const slider = $('speedSlider'), val = $('speedValue');
  slider.value = params.speed || 0.5;
  S.speed = parseFloat(slider.value);
  val.textContent = S.speed + 'x';
  slider.addEventListener('input', () => {
    S.speed = parseFloat(slider.value);
    val.textContent = S.speed + 'x';
  });
  // 键盘
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') stepTo(S.currentStep - 1);
    else if (e.key === 'ArrowRight') stepTo(S.currentStep + 1);
    else if (e.key === ' ') { e.preventDefault(); S.playing ? pause() : play(); }
    else if (e.key === 'r' || e.key === 'R') { pause(); applyStep(0); }
  });
  // 图例
  renderLegend();
  // 画布
  resizeCanvas();
  // 选预设
  const pIdx = (params.preset != null && params.preset >= 0 && params.preset < IR.presets.length)
    ? params.preset : 0;
  loadPreset(pIdx);
  // 自动播放
  if (params.autoplay) setTimeout(play, 400);
  // 动画循环
  requestAnimationFrame(frame);
}

init();
</script>
</body>

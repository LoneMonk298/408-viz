<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>408-Viz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: transparent;
  --card: #ffffff;
  --primary: #2f9e44;
  --primary-d: #2b8a3e;
  --primary-soft: #d3f9d8;
  --text: #343a40;
  --text-2: #868e96;
  --border: #e9ecef;
  --shadow: 0 2px 10px rgba(0,0,0,0.07);
  --radius: 10px;
  --success: #40c057;
  --warning: #fab005;
  --danger:  #fa5252;
  --info:    #228be6;
  --purple:  #be4bdb;
}
html.dark {
  --card: #1e1e20;
  --bg: #141518;
  --text: #e9ecef;
  --text-2: #adb5bd;
  --border: #3a3d44;
  --shadow: 0 2px 10px rgba(0,0,0,0.3);
  --primary-soft: rgba(47,158,68,0.2);
}
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
/* ===== Toolbar ===== */
.toolbar {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px 14px;
  padding: 8px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 2;
}
.toolbar__title {
  font-weight: 700; font-size: 14px;
  color: var(--primary); white-space: nowrap;
}
.select {
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 13px;
  background: var(--card);
  color: var(--text);
  max-width: 260px;
  cursor: pointer;
}
.ctrl-group { display: flex; gap: 8px; align-items: center; }
.ctrl-btn {
  border: none;
  width: 36px; height: 36px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: var(--border);
  color: var(--text);
}
.ctrl-btn:hover:not(:disabled) { opacity: 0.85; }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ctrl-btn.play {
  background: var(--primary);
  color: #fff;
  width: 44px; height: 36px;
  font-size: 14px;
}
.ctrl-btn.play:hover { background: var(--primary-d); }
.speed-control {
  display: flex; align-items: center; gap: 6px; margin-left: 6px;
}
.speed-control label {
  font-size: 12px; color: var(--text-2); white-space: nowrap;
}
.speed-control input[type=range] { width: 80px; cursor: pointer; }
.speed-val {
  font-size: 11px; color: var(--text-2); min-width: 28px;
}
/* ===== Stage ===== */
.stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
#canvas {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  display: block;
}
/* ===== Legend ===== */
.legend-float {
  position: absolute;
  top: 8px; right: 8px;
  background: color-mix(in srgb, var(--card) 85%, transparent);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  max-width: 60%;
  z-index: 3;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
  color: var(--text);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--primary-soft);
  border: 2px solid var(--primary);
  display: inline-block;
}
/* ===== Step overlay ===== */
.step-overlay {
  position: absolute;
  left: 14px; right: 14px; bottom: 14px;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  z-index: 3;
}
.step-overlay__num {
  display: inline-block;
  background: var(--success);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-overlay__body {
  flex: 1;
  min-width: 0;
}
.step-overlay__title {
  font-weight: 700;
  margin-bottom: 2px;
}
.step-overlay__desc {
  color: var(--text-2);
  line-height: 1.5;
  word-break: break-word;
}
.step-overlay__desc code {
  background: var(--primary-soft);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  color: var(--primary-d);
}
.step-overlay__desc .code {
  background: var(--primary-soft);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  color: var(--primary-d);
}
/* mobile */
@media (max-width: 640px) {
  .step-overlay { font-size: 12px; padding: 8px 10px; }
  .legend-float { font-size: 10px; padding: 4px 6px; gap: 6px; max-width: 90%; }
  .toolbar { padding: 6px 10px; gap: 6px 10px; }
  .toolbar__title { font-size: 13px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar__title" id="title">408-Viz</div>
  <select id="presetSelect" class="select"></select>
  <div class="ctrl-group">
    <button class="ctrl-btn" id="resetBtn" title="重置 (R)">&#8634;</button>
    <button class="ctrl-btn" id="prevBtn" title="上一步 (←)">&#9664;</button>
    <button class="ctrl-btn play" id="playBtn" title="播放/暂停 (空格)">&#9654;</button>
    <button class="ctrl-btn" id="nextBtn" title="下一步 (→)">&#9654;</button>
    <div class="speed-control">
      <label>速度</label>
      <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.5" value="0.5">
      <span class="speed-val" id="speedValue">0.5x</span>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="canvas"></canvas>
  <div class="legend-float" id="legend"></div>
  <div class="step-overlay" id="stepOverlay">
    <span class="step-overlay__num" id="overlayNum"></span>
    <div class="step-overlay__body">
      <div class="step-overlay__title" id="overlayTitle"></div>
      <div class="step-overlay__desc" id="overlayDesc"></div>
    </div>
  </div>
</div>

<script>
// ===== IR 数据（由 render.py 注入）=====
const IR = /*__IR__*/null;

// ===== 通用工具 =====
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// 主题判定：只检查 .dark 类
function isDark() {
  return document.documentElement.classList.contains('dark');
}

// 父组件主题同步消息
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'viz-theme') {
    document.documentElement.classList.toggle('dark', !!e.data.dark);
  }
});
// 初始系统偏好兜底
if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}

// ===== 颜色配置（高亮 kind → 颜色）=====
const HL_COLORS = {
  insert:    { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.18)' },
  visit:     { fill: '#228be6', stroke: '#1c7ed6', fillSoft: 'rgba(34,139,230,0.18)' },
  compare:   { fill: '#f59f00', stroke: '#e8590c', fillSoft: 'rgba(245,159,0,0.18)' },
  unbalanced:{ fill: '#fab005', stroke: '#f59f00', fillSoft: 'rgba(250,176,5,0.25)' },
  rotated:   { fill: '#be4bdb', stroke: '#9c36b5', fillSoft: 'rgba(190,75,219,0.18)' },
  removed:   { fill: '#fa5252', stroke: '#e03131', fillSoft: 'rgba(250,82,82,0.22)' },
  swap:      { fill: '#e8590c', stroke: '#d9480f', fillSoft: 'rgba(232,89,12,0.20)' },
  pivot:     { fill: '#be4bdb', stroke: '#9c36b5', fillSoft: 'rgba(190,75,219,0.18)' },
  sorted:    { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.10)' },
  found:     { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.35)' },
  run:       { fill: '#1971c2', stroke: '#1971c2', fillSoft: 'rgba(25,113,194,0.30)' },
  io:        { fill: '#f08c00', stroke: '#f08c00', fillSoft: 'rgba(240,140,0,0.30)' },
  idle:      { fill: '#adb5bd', stroke: '#adb5bd', fillSoft: 'rgba(134,142,150,0.18)' },
  active:    { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.18)' },
  frontier:  { fill: '#f59f00', stroke: '#e8590c', fillSoft: 'rgba(245,159,0,0.20)' },
  done:      { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.15)' },
  path:      { fill: '#9c36b5', stroke: '#9c36b5', fillSoft: 'rgba(156,54,181,0.18)' },
  tree:      { fill: '#2f9e44', stroke: '#2f9e44', fillSoft: 'rgba(47,158,68,0.22)' },
  relax:     { fill: '#f59f00', stroke: '#e8590c', fillSoft: 'rgba(245,159,0,0.18)' },
  hit:       { fill: '#40c057', stroke: '#2b8a3e', fillSoft: 'rgba(64,192,87,0.25)' },
  miss:      { fill: '#fa5252', stroke: '#e03131', fillSoft: 'rgba(250,82,82,0.20)' },
  write:     { fill: '#9c36b5', stroke: '#9c36b5', fillSoft: 'rgba(156,54,181,0.18)' },
  mask:      { fill: '#1971c2', stroke: '#1971c2', fillSoft: 'rgba(25,113,194,0.22)' },
  concept:   { fill: '#228be6', stroke: '#1c7ed6', fillSoft: 'rgba(34,139,230,0.15)' },
  contrast:  { fill: '#fa5252', stroke: '#e03131', fillSoft: 'rgba(250,82,82,0.15)' },
};
const LEGEND = {
  insert:    '新插入',
  visit:     '查找路径',
  compare:   '比较',
  unbalanced:'失衡根',
  rotated:   '旋转结点',
  removed:   '摘出结点',
  swap:      '交换',
  pivot:     '枢轴',
  sorted:    '已就位',
  found:     '命中',
  run:       '执行',
  io:        'I/O',
  idle:      '空闲',
  active:    '进行中',
  frontier:  '已发现',
  done:      '已确定',
  path:      '路径',
  tree:      '树边',
  relax:     '松弛中',
  hit:       '命中',
  miss:      '缺失',
  write:     '写入',
  mask:      '掩码',
  concept:   '概念',
  contrast:  '对比',
};

// ===== 状态 =====
const S = {
  steps: [],
  currentStep: -1,
  playing: false,
  timer: null,
  speed: 0.5,
  presetIdx: 0,
  display: {},   // 节点动画显示状态
  treePos: {},   // 目标布局位置
};

// ===== URL 参数 =====
function getUrlParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    preset: p.has('preset') ? parseInt(p.get('preset'), 10) : null,
    autoplay: p.has('autoplay') ? p.get('autoplay') === '1' : true,
    speed: p.has('speed') ? parseFloat(p.get('speed')) : null,
    hidelegend: p.get('hidelegend') === '1',
  };
}

// ===== Canvas 准备 =====
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(r.width * dpr));
  canvas.height = Math.max(1, Math.floor(r.height * dpr));
}
window.addEventListener('resize', () => { resizeCanvas(); if (IR.struct_type === 'mindmap' && S.currentStep >= 0) applyStep(S.currentStep); else draw(0); });

// ===== 布局：树（tidy 布局：叶子占单位槽位，内部节点取子节点范围中点，整体居中）=====
function computeTreeLayout(root, w, h) {
  if (!root) return { nodes: [], layerGap: 0, r: 16 };
  const insetL = 60, insetR = 60, topPad = 70, bottomPad = 100;
  const availW = Math.max(100, w - insetL - insetR);
  const availH = Math.max(120, h - topPad - bottomPad);
  // 自底向上分配槽位：叶子依次 0,1,2...；内部节点 = 首末子节点槽位中点；
  // 单子按方向偏移（children 位置 0=左 1=右，右子单孩子用 null 占位）
  const slot = {}, depth = {};
  let nextSlot = 0, maxDepth = 0;
  const OFF = 0.6; // 单子方向偏移（槽位单位）
  (function walk(n, d) {
    if (!n) return;
    depth[n.id] = d;
    if (d > maxDepth) maxDepth = d;
    const raw = n.children || [];
    const kids = raw.filter(Boolean);
    if (!kids.length) {
      slot[n.id] = nextSlot++;
      return;
    }
    kids.forEach(c => walk(c, d + 1));
    if (kids.length === 1) {
      const isLeft = raw.indexOf(kids[0]) === 0;
      slot[n.id] = slot[kids[0].id] + (isLeft ? OFF : -OFF);
    } else {
      slot[n.id] = (slot[kids[0].id] + slot[kids[kids.length - 1].id]) / 2;
    }
  })(root, 0);
  // 槽位间距：撑满可用宽度，但小树不过度拉伸（上限 150px）
  const slotVals = Object.values(slot);
  const minS = Math.min.apply(null, slotVals), maxS = Math.max.apply(null, slotVals);
  const spanX = Math.max(0, maxS - minS);
  const sx = spanX === 0 ? 150 : Math.min(availW / spanX, 150);
  const x0 = insetL + (availW - spanX * sx) / 2;
  // 半径随间距缩放，保证相邻节点不重叠
  const r = Math.max(10, Math.min(clamp(sx * 0.3, 14, 22), (sx - 10) / 2));
  // 层间距：撑满可用高度，上限 120px、下限 2r+12（防深树垂直重叠）；浅树垂直居中
  const layerGap = maxDepth === 0 ? 0 : clamp(availH / maxDepth, 2 * r + 12, 120);
  const y0 = topPad + (availH - maxDepth * layerGap) / 2;
  const nodes = [];
  (function collect(n) {
    if (!n) return;
    nodes.push({
      id: n.id, val: n.val,
      x: x0 + (slot[n.id] - minS) * sx,
      y: y0 + depth[n.id] * layerGap,
      r: r,
      children: (n.children || []).filter(Boolean).map(c => c.id),
    });
    (n.children || []).forEach(collect);
  })(root);
  // 同层最小水平间距保护：偏移累积导致不足时缩小半径防重叠
  const byLevel = {};
  nodes.forEach(nd => (byLevel[depth[nd.id]] = byLevel[depth[nd.id]] || []).push(nd.x));
  let minGap = Infinity;
  Object.values(byLevel).forEach(xs => {
    xs.sort((a, b) => a - b);
    for (let i = 1; i < xs.length; i++) minGap = Math.min(minGap, xs[i] - xs[i - 1]);
  });
  if (isFinite(minGap) && minGap < 2 * r + 8) {
    const rr = Math.max(8, (minGap - 8) / 2);
    nodes.forEach(nd => { nd.r = rr; });
  }
  return { nodes, layerGap, r };
}

// ===== 布局：FSM（col 决定列，列内均匀分布，整组在可用区域居中）=====
function computeFSMLayout(states, w, h) {
  const insetL = 80, insetR = 80, topPad = 60, bottomPad = 100;
  const availW = Math.max(120, w - insetL - insetR);
  const availH = Math.max(160, h - topPad - bottomPad);
  const cols = {};
  states.forEach(s => { (cols[s.col] = cols[s.col] || []).push(s); });
  const colKeys = Object.keys(cols).map(Number).sort((a, b) => a - b);
  const colCount = colKeys.length;
  const r = 34;
  // 可用区域在垂直方向进一步收缩 r + 12（给 sublabel 留位）
  const effTop = topPad + r + 12;
  const effBottom = h - bottomPad;
  const nodes = [];
  colKeys.forEach((col, i) => {
    const xs = colCount === 1
      ? insetL + availW / 2
      : insetL + availW * (i / (colCount - 1));
    const items = cols[col];
    const itemGap = items.length === 1 ? 0 : (effBottom - effTop) / (items.length - 1);
    items.forEach((s, row) => {
      nodes.push({
        id: s.id, type: s.type, label: s.label, sublabel: s.sublabel,
        x: xs,
        y: items.length === 1
          ? (effTop + effBottom) / 2
          : effTop + row * itemGap,
        r: r,
      });
    });
  });
  return { nodes, r };
}

// ===== 布局：数组（格子等宽，整体居中；上方 index、下方指针）=====
function computeArrayLayout(arr, w, h) {
  const n = arr.length;
  const insetL = 60, insetR = 60, topPad = 70, bottomPad = 110;
  const availW = Math.max(100, w - insetL - insetR);
  const availH = Math.max(120, h - topPad - bottomPad);
  const cellW = clamp(availW / n, 44, 96);
  const cellH = clamp(cellW * 0.68, 44, 72);
  const x0 = insetL + (availW - n * cellW) / 2;
  const y0 = topPad + (availH - cellH) / 2;
  const nodes = [];
  for (let i = 0; i < n; i++) {
    nodes.push({
      id: 'i' + i, index: i, val: arr[i],
      x: x0 + i * cellW, y: y0,
      cellW, cellH,
    });
  }
  return { nodes, cellW, cellH, n };
}

// ===== 布局：时间轴甘特（rows 横道、bars 按 reveal 裁剪、run 类按进程 label 轮分配色）=====
const BAR_PALETTE = ['#1971c2', '#2f9e44', '#e8590c', '#9c36b5', '#0c8599', '#5f3dc4', '#c2255c', '#66a80f'];
// label 色表按全部 preset 中首次出现顺序分配，保证跨 preset 同进程同色
function computeLabelColors(presets) {
  const map = {};
  let i = 0;
  presets.forEach(p => (p.bars || []).forEach(b => {
    if ((b.kind || 'run') !== 'run' || !b.label || map[b.label] != null) return;
    map[b.label] = BAR_PALETTE[i % BAR_PALETTE.length];
    i++;
  }));
  return map;
}
function computeTimelineLayout(rows, bars, markers, maxReveal, labelColor, w, h) {
  const gutter = 74, insetR = 60, topPad = 78, bottomPad = 104;
  const chartL = gutter, chartR = w - insetR;
  const chartW = Math.max(100, chartR - chartL);
  let maxT = maxReveal;
  bars.forEach(b => { maxT = Math.max(maxT, b.end); });
  markers.forEach(m => { maxT = Math.max(maxT, m.t); });
  const tick = maxT <= 20 ? 1 : maxT <= 40 ? 2 : maxT <= 100 ? 5 : maxT <= 200 ? 10 : maxT <= 400 ? 20 : 50;
  maxT = Math.ceil(maxT / tick) * tick;
  const t2x = (t) => chartL + (t / maxT) * chartW;
  const axisY = topPad - 14;
  const rowTop = topPad + 14, rowBottom = h - bottomPad;
  const rowH = (rowBottom - rowTop) / rows.length;
  const barH = clamp(rowH - 16, 24, 56);
  const rowInfo = rows.map((r, i) => ({ ...r, y: rowTop + i * rowH, h: rowH }));
  const barInfo = bars.map(b => {
    const ri = rowInfo.find(rr => rr.id === b.row);
    const y = ri ? ri.y + (ri.h - barH) / 2 : rowTop;
    return {
      ...b,
      x1: t2x(b.start), x2: t2x(b.end), y, barH,
      color: (b.kind || 'run') === 'run' && b.label ? labelColor[b.label] : null,
    };
  });
  const markerInfo = markers.map((m, i) => ({ ...m, x: t2x(m.t), high: i % 2 === 1 }));
  return { rows: rowInfo, bars: barInfo, markers: markerInfo, maxT, tick, t2x, axisY, rowTop, rowBottom, chartL, chartW };
}

// ===== 布局：图（显式 x/y 0-100 归一化坐标，缺省时圆形自动布局）=====
function computeGraphLayout(nodes, w, h) {
  const padL = 70, padR = 50, padT = 64, padB = 96;
  const availW = Math.max(100, w - padL - padR);
  const availH = Math.max(100, h - padT - padB);
  const hasXY = nodes.every(n => typeof n.x === 'number' && typeof n.y === 'number');
  const maxLen = Math.max(...nodes.map(n => String(n.label || n.id).length), 2);
  const r = clamp(14 + maxLen * 3.2, 20, 30);
  const cx = padL + availW / 2, cy = padT + availH / 2;
  const nodeInfo = nodes.map((n, i) => {
    let x, y;
    if (hasXY) {
      x = padL + (n.x / 100) * availW;
      y = padT + (n.y / 100) * availH;
    } else {
      const ang = -Math.PI / 2 + (i / nodes.length) * Math.PI * 2;
      const rho = Math.min(availW, availH) * 0.38;
      x = cx + Math.cos(ang) * rho;
      y = cy + Math.sin(ang) * rho;
    }
    return { ...n, x, y, r };
  });
  return { nodes: nodeInfo, r };
}

// ===== 布局：网格（行列标题 + 自适应单元格）=====
function computeGridLayout(rows, cols, rowLabels, colLabels, w, h) {
  const labelW = 70, headerH = 28, padL = 60, padR = 50, padT = 64, padB = 96;
  const gridL = padL + labelW;
  const gridT = padT + (colLabels ? headerH : 0);
  const availW = Math.max(80, w - gridL - padR);
  const availH = Math.max(80, h - gridT - padB);
  const cellW = availW / cols;
  const cellH = clamp(availH / rows, 28, 60);
  return { gridL, gridT, cellW, cellH, labelW, headerH, cols, rows,
           colLabels: colLabels || [], rowLabels: rowLabels || [] };
}

// ===== 布局：径向思维导图（中心根节点，分支向外辐射，可折叠子树）=====
function computeMindmapLayout(root, w, h, collapsed) {
  const cx = w / 2, cy = h / 2;
  const maxR = Math.min(w, h) / 2 - 50;
  const nodes = [];

  // 先收集所有可见节点（树遍历，尊重折叠）
  function collectVisible(node, depth, angle, spread) {
    if (!node) return [];
    const isCollapsed = collapsed.has(node.id);
    const result = [{ node, depth, angle, spread, collapsed: isCollapsed,
                      hasChildren: !!(node.children && node.children.length) }];
    if (isCollapsed || !node.children) return result;
    const children = node.children.filter(c => c != null);
    if (!children.length) return result;

    let childSpread;
    if (depth === 0) {
      childSpread = Math.PI * 2;
      const startAngle = -Math.PI / 2;
      children.forEach((child, i) => {
        const ca = startAngle + (i + 0.5) * (childSpread / children.length);
        result.push(...collectVisible(child, depth + 1, ca, childSpread / children.length));
      });
    } else {
      childSpread = Math.min(spread * 1.5, Math.PI * 0.7);
      const startAngle = angle - childSpread / 2;
      children.forEach((child, i) => {
        const ca = startAngle + (i + 0.5) * (childSpread / Math.max(children.length, 1));
        result.push(...collectVisible(child, depth + 1, ca, childSpread / Math.max(children.length, 1)));
      });
    }
    return result;
  }

  const visible = collectVisible(root, 0, -Math.PI / 2, Math.PI * 2);

  // 计算最大深度
  const maxDepth = Math.max(...visible.map(v => v.depth), 1);

  // 半径分层：depth 1 = 0.35*maxR, depth 2 = 0.65*maxR, depth 3+ = maxR
  const depthRadii = {};
  for (let d = 1; d <= maxDepth; d++) {
    if (d === 1) depthRadii[d] = maxR * 0.38;
    else if (d === 2) depthRadii[d] = maxR * 0.68;
    else depthRadii[d] = maxR;
  }

  // 布局节点
  visible.forEach(v => {
    const labelLen = (v.node.label || '').length;
    const r = v.depth === 0 ? 28 : Math.max(16, Math.min(22, 12 + labelLen * 1.4));
    const radius = v.depth === 0 ? 0 : depthRadii[v.depth] || maxR;
    const x = cx + (v.depth === 0 ? 0 : radius * Math.cos(v.angle));
    const y = cy + (v.depth === 0 ? 0 : radius * Math.sin(v.angle));
    nodes.push({
      id: v.node.id, label: v.node.label || '', desc: v.node.desc || '',
      x, y, depth: v.depth, r, angle: v.angle,
      collapsed: v.collapsed, hasChildren: v.hasChildren,
    });
  });

  // 碰撞检测：同层或相邻层节点过近时沿径向推开
  for (let iter = 0; iter < 8; iter++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        if (a.depth === 0 || b.depth === 0) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = a.r + b.r + 6;
        if (dist < minDist && dist > 0.01) {
          const push = (minDist - dist) / 2;
          const ux = dx / dist, uy = dy / dist;
          // 不推根节点
          a.x += ux * push; a.y += uy * push;
          b.x -= ux * push; b.y -= uy * push;
          moved = true;
        } else if (dist < 0.01) {
          // 完全重叠：随机推开
          a.x += (Math.random() - 0.5) * 4;
          a.y += (Math.random() - 0.5) * 4;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }

  // 边界裁剪：确保节点在画布内
  const padX = 20, padTop = 50, padBot = 60;
  for (const n of nodes) {
    n.x = clamp(n.x, n.r + padX, w - n.r - padX);
    n.y = clamp(n.y, n.r + padTop, h - n.r - padBot);
  }

  return { nodes, cx, cy };
}

// ===== 应用步骤 =====
function applyStep(idx) {
  if (idx < 0 || idx >= S.steps.length) return;
  S.currentStep = idx;
  const st = S.steps[idx];
  // 字幕
  $('overlayNum').textContent = `步骤 ${idx+1}/${S.steps.length}`;
  $('overlayTitle').textContent = st.title;
  // 允许在 desc 中用 <code>xxx</code>
  $('overlayDesc').innerHTML = (st.desc || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  // 按钮状态
  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = idx === S.steps.length - 1;
  // 树布局
  S.treePos = {};
  if (IR.struct_type === 'tree') {
    const r = canvas.getBoundingClientRect();
    const lay = computeTreeLayout(st.tree, r.width, r.height);
    S.layout = lay;
    // 初始化 display 状态
    lay.nodes.forEach(n => {
      const d = S.display[n.id];
      if (d) {
        d.tx = n.x; d.ty = n.y; d.tval = n.val; d.ta = 1; d.tr = n.r;
      } else {
        S.display[n.id] = {
          x: n.x, y: n.y, a: 0, tx: n.x, ty: n.y, ta: 1,
          val: n.val, tval: n.val, r: n.r, tr: n.r,
        };
      }
    });
    // 高亮
    S.hl = {};
    (st.hl || []).forEach(h => { S.hl[h.node_id] = h.kind; });
  } else if (IR.struct_type === 'fsm') {
    const r = canvas.getBoundingClientRect();
    const lay = computeFSMLayout(IR.states, r.width, r.height);
    S.layout = lay;
    // 初始化 display
    lay.nodes.forEach(n => {
      if (!S.display[n.id]) {
        S.display[n.id] = { x: n.x, y: n.y, a: 0.6, tx: n.x, ty: n.y, ta: 0.6, r: n.r, tr: n.r };
      }
    });
    // 当前 active 高亮
    S.hl = {};
    (st.active || []).forEach(id => { S.hl[id] = 'insert'; });
    S.lastTrans = new Set((st.lastTrans || []).map(t => t.id));
  } else if (IR.struct_type === 'array') {
    const r = canvas.getBoundingClientRect();
    const lay = computeArrayLayout(st.array, r.width, r.height);
    const prev = idx > 0 ? S.steps[idx - 1].array : null;
    const sameLen = prev && prev.length === st.array.length;
    // swap 检测：长度相同且恰好两位置互换（排序交换的典型形态）
    S.swapAnim = null;
    let swapPair = null;
    if (sameLen) {
      const diff = [];
      for (let i = 0; i < st.array.length; i++) {
        if (prev[i] !== st.array[i]) diff.push(i);
      }
      if (diff.length === 2 &&
          prev[diff[0]] === st.array[diff[1]] &&
          prev[diff[1]] === st.array[diff[0]]) {
        swapPair = diff;
      }
    }
    if (!sameLen) {
      // 长度变化：整体重建，新槽位淡入
      S.display = {};
      lay.nodes.forEach(nd => {
        S.display[nd.id] = {
          x: nd.x, y: nd.y, a: 0, tx: nd.x, ty: nd.y, ta: 1,
          val: nd.val, tval: nd.val,
        };
      });
    } else {
      lay.nodes.forEach(nd => {
        const d = S.display[nd.id];
        if (d) {
          d.tx = nd.x; d.ty = nd.y; d.ta = 1; d.tval = nd.val;
          if (!swapPair) d.val = nd.val;
        } else {
          S.display[nd.id] = {
            x: nd.x, y: nd.y, a: 0, tx: nd.x, ty: nd.y, ta: 1,
            val: nd.val, tval: nd.val,
          };
        }
      });
      if (swapPair) {
        S.swapAnim = { pair: swapPair, start: performance.now() };
      }
    }
    S.layout = lay;
    S.hl = {};
    (st.hl || []).forEach(h => { S.hl[h.index] = h.kind; });
    S.ptrs = st.ptrs || [];
  } else if (IR.struct_type === 'timeline') {
    const p = IR.presets[S.presetIdx];
    const r = canvas.getBoundingClientRect();
    const maxReveal = Math.max.apply(null, p.steps.map(s => s.reveal));
    if (!S.tlColors) S.tlColors = computeLabelColors(IR.presets);
    S.layout = computeTimelineLayout(
      IR.rows || [], p.bars || [], p.markers || [], maxReveal, S.tlColors, r.width, r.height);
    // 时间游标：首次直接落到 reveal，之后平滑动画
    if (!S.nowT) S.nowT = { t: st.reveal, tt: st.reveal };
    else S.nowT.tt = st.reveal;
    S.active = new Set(st.active || []);
  } else if (IR.struct_type === 'graph') {
    const r = canvas.getBoundingClientRect();
    S.layout = computeGraphLayout(IR.nodes || [], r.width, r.height);
    S.hl = {};
    (st.hl || []).forEach(h => { S.hl[h.node_id] = h.kind; });
    S.edgeHl = {};
    (st.edge_hl || []).forEach(h => { S.edgeHl[h.edge_id] = h.kind; });
    S.vals = {};
    (st.vals || []).forEach(v => { S.vals[v.node_id] = String(v.val); });
  } else if (IR.struct_type === 'grid') {
    const r = canvas.getBoundingClientRect();
    S.layout = computeGridLayout(
      IR.rows || 1, IR.cols || 1, IR.row_labels || [], IR.col_labels || [],
      r.width, r.height);
    // cells: 每步完整快照（r/c/val），构建成 map
    S.gridCells = {};
    (st.cells || []).forEach(c => { S.gridCells[c.r + ',' + c.c] = String(c.val); });
    S.hl = {};
    (st.hl || []).forEach(h => { S.hl[h.r + ',' + h.c] = h.kind; });
  } else if (IR.struct_type === 'mindmap') {
    const r = canvas.getBoundingClientRect();
    if (!S.collapsed) S.collapsed = new Set();
    const preset = IR.presets[S.presetIdx];
    const root = preset.root;
    const lay = computeMindmapLayout(root, r.width, r.height, S.collapsed);
    S.layout = lay;
    S.mindmapRoot = root;
    // 初始化 display
    lay.nodes.forEach(n => {
      const d = S.display[n.id];
      if (d) {
        d.tx = n.x; d.ty = n.y; d.ta = 1; d.tr = n.r;
      } else {
        S.display[n.id] = {
          x: n.x, y: n.y, a: 0, tx: n.x, ty: n.y, ta: 1,
          r: n.r, tr: n.r,
        };
      }
    });
    // 移除不在布局中的节点（折叠后消失的）
    const liveIds = new Set(lay.nodes.map(n => n.id));
    for (const id in S.display) {
      if (!liveIds.has(id)) S.display[id].ta = 0;
    }
    S.hl = {};
    (preset.hl || []).forEach(h => { S.hl[h.node_id] = h.kind; });
  }
}

// ===== 绘制 =====
function draw(ts) {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  if (!S.layout || !S.steps.length) return;

  // 动画插值
  for (const id in S.display) {
    const d = S.display[id];
    d.x += (d.tx - d.x) * 0.18;
    d.y += (d.ty - d.y) * 0.18;
    d.a += (d.ta - d.a) * 0.22;
    if (d.tr != null) d.r += (d.tr - d.r) * 0.18;
  }
  if (S.nowT) S.nowT.t += (S.nowT.tt - S.nowT.t) * 0.15;

  if (IR.struct_type === 'tree') drawTree(ts);
  else if (IR.struct_type === 'fsm') drawFSM(ts);
  else if (IR.struct_type === 'array') drawArray(ts);
  else if (IR.struct_type === 'timeline') drawTimeline(ts);
  else if (IR.struct_type === 'graph') drawGraph(ts);
  else if (IR.struct_type === 'grid') drawGrid(ts);
  else if (IR.struct_type === 'mindmap') drawMindmap(ts);
}

// ===== 树渲染 =====
function drawTree(ts) {
  const dark = isDark();
  const baseFill = dark ? '#252527' : '#ffffff';
  const baseStroke = dark ? '#5c5f66' : '#c1c6cc';
  const edgeColor = dark ? '#3a3d44' : '#dee2e6';
  const textColor = dark ? '#e9ecef' : '#343a40';
  const nodes = S.layout.nodes;

  // 画边
  ctx.lineWidth = 2;
  nodes.forEach(n => {
    const dn = S.display[n.id];
    if (!dn) return;
    (n.children || []).forEach(cid => {
      const child = S.display[cid];
      if (child) {
        ctx.strokeStyle = edgeColor;
        ctx.beginPath();
        ctx.moveTo(dn.x, dn.y + dn.r);
        ctx.lineTo(child.x, child.y - child.r);
        ctx.stroke();
      }
    });
  });

  // 画节点
  nodes.forEach(n => {
    const d = S.display[n.id];
    if (!d) return;
    let fill = baseFill, stroke = baseStroke, pulse = false;
    const kind = S.hl[n.id];
    if (kind && HL_COLORS[kind]) {
      fill = HL_COLORS[kind].fillSoft;
      stroke = HL_COLORS[kind].stroke;
      pulse = (kind === 'insert' || kind === 'unbalanced' || kind === 'rotated');
    }
    const rr = d.r * (pulse ? (1 + 0.06 * Math.sin(ts / 180)) : 1);
    ctx.save();
    ctx.globalAlpha = clamp(d.a, 0, 1);
    ctx.beginPath();
    ctx.arc(d.x, d.y, rr, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    // 文本
    ctx.fillStyle = textColor;
    ctx.font = `600 ${Math.floor(rr * 0.8)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(n.val), d.x, d.y);
    ctx.restore();
  });
}

// ===== 边绘制辅助 =====
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px-x1)*dx + (py-y1)*dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
}
function drawArrowHead(x, y, ux, uy, color) {
  const ah = 7;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - ux*ah - uy*ah*0.5, y - uy*ah + ux*ah*0.5);
  ctx.lineTo(x - ux*ah + uy*ah*0.5, y - uy*ah - ux*ah*0.5);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function drawEdgeLabel(lbl, x, y, color, dark, textColor) {
  const w = ctx.measureText(lbl).width + 8;
  ctx.fillStyle = dark ? '#1e1e20' : '#ffffff';
  ctx.fillRect(x - w/2, y - 9, w, 18);
  ctx.fillStyle = color;
  ctx.fillText(lbl, x, y);
}

// ===== FSM 渲染 =====
function drawFSM(ts) {
  const dark = isDark();
  const textColor = dark ? '#e9ecef' : '#343a40';
  const edgeColor = dark ? '#3a3d44' : '#dee2e6';
  const nodes = S.layout.nodes;

  // 边（直线穿过其他节点时改为弧线绕行，避免遮挡与 label 重叠）
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let bowBelow = 0, bowAbove = 0; // 同向弧线依次错开
  IR.transitions.forEach(tr => {
    const a = nodes.find(n => n.id === tr.from);
    const b = nodes.find(n => n.id === tr.to);
    if (!a || !b) return;
    const hl = S.lastTrans && S.lastTrans.has(tr.id);
    const hlColor = hl ? '#40c057' : null;
    ctx.strokeStyle = hlColor || edgeColor;
    ctx.lineWidth = hl ? 3 : 1.5;
    const lbl = tr.label || '';

    if (a.id === b.id) {
      // 自环：节点上方小弧
      const rho = a.r * 0.6, cy0 = a.y - a.r * 0.8;
      ctx.beginPath();
      ctx.arc(a.x, cy0, rho, Math.PI, Math.PI * 2);
      ctx.stroke();
      drawArrowHead(a.x + rho, cy0, 0, 1, hlColor || edgeColor);
      if (lbl) drawEdgeLabel(lbl, a.x, cy0 - rho - 12, hlColor || textColor, dark, textColor);
      return;
    }

    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx/dist, uy = dy/dist;
    const x1 = a.x + ux * a.r, y1 = a.y + uy * a.r;
    const x2 = b.x - ux * b.r, y2 = b.y - uy * b.r;
    const blocked = nodes.some(n =>
      n !== a && n !== b &&
      distToSegment(n.x, n.y, a.x, a.y, b.x, b.y) < n.r + 10);

    if (blocked) {
      // 弧线绕行：回退边从下方绕，前跳长边从上方绕
      const below = b.x < a.x;
      let nx = -uy, ny = ux;
      if (ny < 0) { nx = -nx; ny = -ny; } // 法线统一指向下方
      const sign = below ? 1 : -1;
      const bow = clamp(dist * 0.25, 80, 160) + (below ? bowBelow++ : bowAbove++) * 28;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const cx = mx + nx * bow * sign, cy = my + ny * bow * sign;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.stroke();
      // 箭头沿曲线终点切线方向
      let tx = x2 - cx, ty = y2 - cy;
      const tl = Math.hypot(tx, ty) || 1;
      drawArrowHead(x2, y2, tx / tl, ty / tl, hlColor || edgeColor);
      // label 放贝塞尔中点（弧线最低/最高处）
      if (lbl) drawEdgeLabel(lbl,
        0.25*x1 + 0.5*cx + 0.25*x2, 0.25*y1 + 0.5*cy + 0.25*y2,
        hlColor || textColor, dark, textColor);
    } else {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      drawArrowHead(x2, y2, ux, uy, hlColor || edgeColor);
      if (lbl) drawEdgeLabel(lbl, (x1 + x2) / 2, (y1 + y2) / 2, hlColor || textColor, dark, textColor);
    }
  });

  // 节点
  nodes.forEach(n => {
    const d = S.display[n.id];
    if (!d) return;
    let fill = dark ? '#252527' : '#ffffff';
    let stroke = dark ? '#5c5f66' : '#c1c6cc';
    const active = S.hl[n.id];
    if (active) {
      fill = HL_COLORS[active].fillSoft;
      stroke = HL_COLORS[active].stroke;
    } else if (n.type === 'start') {
      stroke = '#228be6';
    } else if (n.type === 'success') {
      stroke = '#40c057';
    } else if (n.type === 'failure' || n.type === 'terminal') {
      stroke = '#fa5252';
    }
    ctx.save();
    ctx.globalAlpha = clamp(d.a, 0, 1);
    // 圆
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = active ? 3 : 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    // 标签
    ctx.fillStyle = textColor;
    ctx.font = `600 12px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, d.x, d.y);
    if (n.sublabel) {
      ctx.font = `10px -apple-system, sans-serif`;
      ctx.fillStyle = dark ? '#adb5bd' : '#868e96';
      ctx.fillText(n.sublabel, d.x, d.y + d.r + 14);
    }
    ctx.restore();
  });
}

// ===== 数组渲染 =====
function drawArray(ts) {
  const dark = isDark();
  const baseFill = dark ? '#252527' : '#ffffff';
  const baseStroke = dark ? '#5c5f66' : '#c1c6cc';
  const textColor = dark ? '#e9ecef' : '#343a40';
  const dimColor = dark ? '#868e96' : '#adb5bd';
  const nodes = S.layout.nodes;
  const { cellW, cellH } = S.layout;

  // swap 飞行动画：600ms，两元素上下分层交叉飞行，各自携带旧值，结束后归位换值
  let swapProg = 0;
  if (S.swapAnim) {
    swapProg = clamp((performance.now() - S.swapAnim.start) / 600, 0, 1);
    if (swapProg >= 1) {
      S.swapAnim.pair.forEach(i => {
        const d = S.display['i' + i];
        if (d) d.val = d.tval;
      });
      S.swapAnim = null;
    }
  }
  const swapIdx = S.swapAnim ? S.swapAnim.pair : [];

  nodes.forEach(nd => {
    const d = S.display[nd.id];
    if (!d) return;
    const kind = S.hl[nd.index];
    let fill = baseFill, stroke = baseStroke, lw = 1.5;
    if (kind && HL_COLORS[kind]) {
      fill = HL_COLORS[kind].fillSoft;
      stroke = HL_COLORS[kind].stroke;
      lw = 3;
    }
    // 交换中的元素：一上一下双弧交叉，水平错位 easing（先起飞的先到位），X 形轨迹不重叠
    let ex = d.x, ey = d.y, eval_ = d.val, alpha = clamp(d.a, 0, 1);
    const si = swapIdx.indexOf(nd.index);
    if (si >= 0) {
      const other = swapIdx[1 - si];
      const p = si === 0
        ? 1 - Math.pow(1 - swapProg, 1.7)
        : Math.pow(swapProg, 1.7);
      ex = d.x + (other - nd.index) * cellW * p;
      ey = d.y - Math.sin(Math.PI * swapProg) * (si === 0 ? 48 : -40);
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    // 格子
    ctx.beginPath();
    ctx.roundRect(ex, ey, cellW - 3, cellH, 6);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    // index（格子上方）
    ctx.fillStyle = dimColor;
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(nd.index), ex + (cellW - 3) / 2, ey - 11);
    // 值
    if (eval_ != null) {
      ctx.fillStyle = textColor;
      ctx.font = '600 15px -apple-system, sans-serif';
      ctx.fillText(String(eval_), ex + (cellW - 3) / 2, ey + cellH / 2);
    }
    ctx.restore();
  });

  // 指针（格子下方，同一格多个指针横向错开）
  const byIdx = {};
  (S.ptrs || []).forEach(p => { (byIdx[p.index] = byIdx[p.index] || []).push(p.name); });
  Object.keys(byIdx).forEach(i => {
    const d = S.display['i' + i];
    if (!d) return;
    const names = byIdx[i];
    const cx = d.x + (cellW - 3) / 2;
    const yb = d.y + cellH;
    names.forEach((name, k) => {
      const off = (k - (names.length - 1) / 2) * 30;
      ctx.save();
      ctx.fillStyle = dark ? '#adb5bd' : '#495057';
      // 倒三角
      ctx.beginPath();
      ctx.moveTo(cx + off - 4, yb + 6);
      ctx.lineTo(cx + off + 4, yb + 6);
      ctx.lineTo(cx + off, yb + 12);
      ctx.closePath();
      ctx.fill();
      ctx.font = '600 10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(name, cx + off, yb + 14);
      ctx.restore();
    });
  });
}

// ===== 时间轴甘特渲染 =====
function drawTimeline(ts) {
  const dark = isDark();
  const dimColor = dark ? '#868e96' : '#adb5bd';
  const gridColor = dark ? '#2a2d33' : '#eef1f4';
  const axisColor = dark ? '#5c5f66' : '#c1c6cc';
  const lay = S.layout;
  const now = S.nowT ? S.nowT.t : 0;
  const fmtT = (t) => (Math.round(t * 100) / 100).toString();

  // 网格 + 刻度
  ctx.font = '10px -apple-system, sans-serif';
  for (let t = 0; t <= lay.maxT + 1e-9; t += lay.tick) {
    const x = lay.t2x(t);
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 0.5, lay.axisY);
    ctx.lineTo(x + 0.5, lay.rowBottom);
    ctx.stroke();
    ctx.fillStyle = dimColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(fmtT(t), x, lay.axisY - 6);
  }
  // 轴线
  ctx.strokeStyle = axisColor;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(lay.chartL, lay.axisY + 0.5);
  ctx.lineTo(lay.chartL + lay.chartW, lay.axisY + 0.5);
  ctx.stroke();

  // 行分隔线 + 行标签
  lay.rows.forEach((r, i) => {
    if (i > 0) {
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lay.chartL, r.y + 0.5);
      ctx.lineTo(lay.chartL + lay.chartW, r.y + 0.5);
      ctx.stroke();
    }
    ctx.fillStyle = dark ? '#adb5bd' : '#495057';
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(r.label, lay.chartL - 12, r.y + r.h / 2);
  });

  // bars：实体部分 = 已执行（now 裁剪）；active 且未完成的画半透明全长预览（已规划区间）
  lay.bars.forEach(b => {
    if (now < b.start) return;
    const fullW = b.x2 - b.x1;
    if (fullW < 1.5) return;
    const kind = b.kind || 'run';
    const isActive = S.active && S.active.has(b.id);
    const solidW = Math.min(b.x2, lay.t2x(now)) - b.x1;
    const inProgress = now < b.end;
    let fill, stroke, textColorBar, lw = 1.5;
    if (kind === 'idle') {
      fill = dark ? '#34373d' : '#eceff1';
      stroke = dark ? '#5c5f66' : '#ced4da';
      textColorBar = dimColor;
      lw = 1;
    } else if (kind === 'io') {
      fill = '#f08c00'; stroke = '#d9480f'; textColorBar = '#fff';
    } else {
      fill = b.color || '#1971c2'; stroke = fill; textColorBar = '#fff';
    }
    const drawRect = (w, alpha) => {
      ctx.save();
      ctx.globalAlpha = alpha;
      if (isActive) {
        const pulse = (Math.sin(ts / 180) + 1) / 2;
        ctx.shadowColor = 'rgba(64,192,87,' + (0.28 + 0.2 * pulse) + ')';
        ctx.shadowBlur = 5 + 4 * pulse;
        lw = 2.5;
      }
      ctx.beginPath();
      ctx.roundRect(b.x1, b.y, w, b.barH, 5);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = lw;
      ctx.strokeStyle = isActive ? '#40c057' : stroke;
      ctx.stroke();
      ctx.restore();
    };
    if (isActive && inProgress && solidW < fullW - 1) drawRect(fullW, 0.3);
    if (solidW >= 1.5) drawRect(solidW, 1);
    if (b.label) {
      const solid = solidW >= 24;
      ctx.save();
      ctx.globalAlpha = solid ? 1 : 0.65;
      ctx.fillStyle = textColorBar;
      ctx.font = '700 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.label, b.x1 + (solid ? solidW : fullW) / 2, b.y + b.barH / 2);
      ctx.restore();
    }
  });

  // markers：t <= now 的显示（轴上方三角 + 交错高度标签）
  lay.markers.forEach(m => {
    if (now < m.t) return;
    const ly = m.high ? lay.axisY - 52 : lay.axisY - 32;
    ctx.save();
    ctx.strokeStyle = dark ? '#4c5157' : '#d0d5da';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(m.x, ly + 10);
    ctx.lineTo(m.x, lay.axisY - 4);
    ctx.stroke();
    ctx.setLineDash([]);
    // 倒三角落在轴上
    ctx.fillStyle = dark ? '#868e96' : '#495057';
    ctx.beginPath();
    ctx.moveTo(m.x - 4, lay.axisY - 8);
    ctx.lineTo(m.x + 4, lay.axisY - 8);
    ctx.lineTo(m.x, lay.axisY - 1);
    ctx.closePath();
    ctx.fill();
    if (m.label) {
      ctx.fillStyle = dark ? '#adb5bd' : '#495057';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(m.label, m.x, ly + 10);
    }
    ctx.restore();
  });

  // 时间游标：绿色虚线 + 底部时刻标签
  const cx = lay.t2x(now);
  ctx.save();
  ctx.strokeStyle = '#40c057';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.moveTo(cx, lay.axisY);
  ctx.lineTo(cx, lay.rowBottom + 4);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#40c057';
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('t=' + fmtT(now), cx, lay.rowBottom + 8);
  ctx.restore();
}

// ===== 图渲染 =====
function drawGraph(ts) {
  const dark = isDark();
  const textColor = dark ? '#e9ecef' : '#343a40';
  const edgeColor = dark ? '#3a3d44' : '#dee2e6';
  const nodes = S.layout.nodes;
  const directed = !!IR.directed;
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });

  // 边（权重 label 在中点；高亮 kind 决定颜色/线宽）
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  (IR.edges || []).forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    const kind = S.edgeHl[e.id];
    const hlColor = kind ? HL_COLORS[kind].stroke : null;
    ctx.strokeStyle = hlColor || edgeColor;
    ctx.lineWidth = kind ? 3.5 : 1.5;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const x1 = a.x + ux * a.r, y1 = a.y + uy * a.r;
    const x2 = b.x - ux * (b.r + (directed ? 8 : 0));
    const y2 = b.y - uy * (b.r + (directed ? 8 : 0));
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    if (directed) drawArrowHead(x2, y2, ux, uy, hlColor || edgeColor);
    if (e.weight != null) {
      const lblColor = hlColor || '#868e96';
      drawEdgeLabel(String(e.weight), (x1 + x2) / 2, (y1 + y2) / 2, lblColor, dark, textColor);
    }
  });

  // 节点（kind 着色，visit 脉冲）
  nodes.forEach(n => {
    let fill = dark ? '#252527' : '#ffffff';
    let stroke = dark ? '#5c5f66' : '#c1c6cc';
    const kind = S.hl[n.id];
    if (kind && HL_COLORS[kind]) {
      fill = HL_COLORS[kind].fillSoft;
      stroke = HL_COLORS[kind].stroke;
    }
    ctx.save();
    if (kind === 'visit' || kind === 'found') {
      const pulse = (Math.sin(ts / 180) + 1) / 2;
      ctx.shadowColor = 'rgba(64,192,87,' + (0.3 + 0.25 * pulse) + ')';
      ctx.shadowBlur = 6 + 5 * pulse;
    }
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = kind ? 3 : 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = textColor;
    ctx.font = '600 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(n.label || n.id), n.x, n.y);
    // 数值徽章（dist/深度/序号等，节点下方）
    const val = S.vals && S.vals[n.id];
    if (val != null) {
      const vw = ctx.measureText(val).width + 10;
      const bx = n.x - vw / 2, by = n.y + n.r + 6;
      ctx.beginPath();
      ctx.roundRect(bx, by, vw, 16, 4);
      ctx.fillStyle = dark ? '#34373d' : '#f1f3f5';
      ctx.fill();
      ctx.strokeStyle = kind ? HL_COLORS[kind].stroke : (dark ? '#5c5f66' : '#ced4da');
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = dark ? '#e9ecef' : '#495057';
      ctx.font = '600 10px -apple-system, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(val, n.x, by + 8);
    }
  });
}

// ===== 网格渲染 =====
function drawGrid(ts) {
  const dark = isDark();
  const textColor = dark ? '#e9ecef' : '#343a40';
  const dimColor = dark ? '#868e96' : '#adb5bd';
  const gridColor = dark ? '#3a3d44' : '#dee2e6';
  const cellFill = dark ? '#252527' : '#ffffff';
  const lay = S.layout;
  if (!lay) return;

  // 列标题
  if (lay.colLabels.length) {
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lay.colLabels.forEach((label, ci) => {
      const cx = lay.gridL + ci * lay.cellW + lay.cellW / 2;
      const cy = lay.gridT - lay.headerH / 2 - 4;
      ctx.fillStyle = dimColor;
      ctx.fillText(label, cx, cy);
    });
  }

  // 行标题
  if (lay.rowLabels.length) {
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    lay.rowLabels.forEach((label, ri) => {
      const cy = lay.gridT + ri * lay.cellH + lay.cellH / 2;
      ctx.fillStyle = dimColor;
      ctx.fillText(label, lay.gridL - 8, cy);
    });
  }

  // 单元格
  for (let ri = 0; ri < lay.rows; ri++) {
    for (let ci = 0; ci < lay.cols; ci++) {
      const x = lay.gridL + ci * lay.cellW;
      const y = lay.gridT + ri * lay.cellH;
      const key = ri + ',' + ci;
      const kind = S.hl[key];
      let fill = cellFill, stroke = gridColor, lw = 1;
      if (kind && HL_COLORS[kind]) {
        fill = HL_COLORS[kind].fillSoft;
        stroke = HL_COLORS[kind].stroke;
        lw = 2;
      }
      ctx.save();
      if (kind === 'hit' || kind === 'miss' || kind === 'write') {
        const pulse = (Math.sin(ts / 180) + 1) / 2;
        ctx.shadowColor = HL_COLORS[kind].fill;
        ctx.shadowBlur = 4 + 4 * pulse;
        lw = 2.5;
      }
      ctx.beginPath();
      ctx.rect(x, y, lay.cellW, lay.cellH);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = lw;
      ctx.strokeStyle = stroke;
      ctx.stroke();
      ctx.restore();

      const val = S.gridCells && S.gridCells[key];
      if (val != null) {
        ctx.fillStyle = textColor;
        ctx.font = '600 13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val, x + lay.cellW / 2, y + lay.cellH / 2);
      }
    }
  }
}

// ===== 思维导图渲染 =====
function drawMindmap(ts) {
  const dark = isDark();
  const textColor = dark ? '#e9ecef' : '#343a40';
  const dimColor = dark ? '#868e96' : '#adb5bd';
  const lineColor = dark ? '#3a3d44' : '#ced4da';
  const lay = S.layout;
  if (!lay) return;

  const nodeMap = {};
  lay.nodes.forEach(n => { nodeMap[n.id] = n; });

  // 构建父子边列表
  const edges = [];
  function collectEdges(node, parentId) {
    if (!node) return;
    if (parentId && nodeMap[node.id] && nodeMap[parentId]) {
      edges.push({ from: parentId, to: node.id });
    }
    if (S.collapsed && S.collapsed.has(node.id)) return;
    if (node.children) {
      node.children.filter(c => c != null).forEach(c => collectEdges(c, node.id));
    }
  }
  if (S.mindmapRoot) collectEdges(S.mindmapRoot, null);

  // 画边（贝塞尔曲线）
  edges.forEach(e => {
    const from = S.display[e.from], to = S.display[e.to];
    if (!from || !to) return;
    const fa = from.a !== undefined ? from.a : 1;
    const ta = to.a !== undefined ? to.a : 1;
    const alpha = Math.min(fa, ta);
    if (alpha < 0.05) return;
    const fn = nodeMap[e.from], tn = nodeMap[e.to];
    const fx = from.x, fy = from.y;
    const tx = to.x, ty = to.y;
    // 控制点：沿父→子方向偏移
    const mx = (fx + tx) / 2, my = (fy + ty) / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = fn && fn.depth === 0 ? 2 : 1.5;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.quadraticCurveTo(mx, my, tx, ty);
    ctx.stroke();
    ctx.restore();
  });

  // 画节点
  lay.nodes.forEach(n => {
    const d = S.display[n.id];
    if (!d) return;
    const a = d.a !== undefined ? d.a : 1;
    if (a < 0.03) return;

    const kind = S.hl[n.id];
    let fill, stroke, lw;
    if (n.depth === 0) {
      fill = dark ? '#2f9e44' : '#2f9e44';
      stroke = dark ? '#2b8a3e' : '#2b8a3e';
      lw = 3;
    } else if (kind && HL_COLORS[kind]) {
      fill = HL_COLORS[kind].fillSoft;
      stroke = HL_COLORS[kind].stroke;
      lw = 2;
    } else {
      const colors = dark
        ? ['#1e3a5f', '#3b1e5f', '#5f1e3b', '#1e5f3b', '#5f3b1e', '#3b5f1e']
        : ['#e7f5ff', '#f3e8ff', '#ffe0f0', '#e8f5e9', '#fff4e6', '#f0f7ff'];
      const strokes = dark
        ? ['#1971c2', '#9c36b5', '#c2255c', '#2f9e44', '#e8590c', '#1971c2']
        : ['#1971c2', '#9c36b5', '#c2255c', '#2b8a3e', '#e8590c', '#1c7ed6'];
      const ci = n.depth > 0 ? (n.depth - 1) % 6 : 0;
      fill = colors[ci];
      stroke = strokes[ci];
      lw = 1.5;
    }

    ctx.save();
    ctx.globalAlpha = a;
    // 阴影
    if (n.depth === 0) {
      ctx.shadowColor = 'rgba(47,158,68,0.4)';
      ctx.shadowBlur = 12;
    }

    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();

    // 折叠指示器（+/- 号）放在节点右下角
    if (n.hasChildren) {
      ctx.shadowBlur = 0;
      const bx = d.x + d.r * 0.65, by = d.y + d.r * 0.65;
      const badge = 7;
      ctx.fillStyle = n.collapsed ? stroke : (dark ? '#5c5f66' : '#adb5bd');
      ctx.beginPath();
      ctx.arc(bx, by, badge, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = dark ? '#2a2a2e' : '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // +/- 符号
      ctx.strokeStyle = dark ? '#e9ecef' : '#fff';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(bx - 3, by);
      ctx.lineTo(bx + 3, by);
      if (n.collapsed) {
        ctx.moveTo(bx, by - 3);
        ctx.lineTo(bx, by + 3);
      }
      ctx.stroke();
    }

    ctx.shadowBlur = 0;

    // 标签
    ctx.fillStyle = n.depth === 0 ? '#fff' : textColor;
    ctx.font = (n.depth === 0 ? '700 13px' : '600 12px') + ' -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, d.x, d.y);

    // desc（子节点显示在下方）
    if (n.desc && n.depth > 0 && !n.collapsed) {
      ctx.fillStyle = dimColor;
      ctx.font = '400 10px -apple-system, sans-serif';
      ctx.fillText(n.desc, d.x, d.y + d.r + 12);
    }

    ctx.restore();
  });

  // 悬停 tooltip
  if (S.hoverNode && S.hoverNode.desc) {
    const n = S.hoverNode;
    const d = S.display[n.id];
    if (d) {
      const text = n.desc;
      ctx.save();
      ctx.font = '400 12px -apple-system, sans-serif';
      const tw = ctx.measureText(text).width + 20;
      const th = 28;
      let bx = d.x - tw / 2, by = d.y - d.r - th - 8;
      if (by < 10) by = d.y + d.r + 8;
      ctx.fillStyle = dark ? '#2a2a2e' : '#333';
      ctx.beginPath();
      ctx.roundRect(bx, by, tw, th, 6);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + tw / 2, by + th / 2);
      ctx.restore();
    }
  }
}

// ===== 图例 =====
const LEGEND_KINDS = {
  tree: ['insert', 'visit', 'compare', 'unbalanced', 'rotated', 'removed'],
  fsm: ['insert'],
  array: ['insert', 'visit', 'compare', 'swap', 'pivot', 'sorted', 'found', 'removed'],
  timeline: ['run', 'io', 'idle', 'active'],
  graph: ['visit', 'frontier', 'done', 'path', 'tree', 'relax'],
  grid: ['hit', 'miss', 'compare', 'write', 'found', 'mask'],
  mindmap: ['concept', 'contrast'],
};
function renderLegend() {
  const legend = $('legend');
  const showKinds = LEGEND_KINDS[IR.struct_type] || Object.keys(LEGEND);
  legend.innerHTML = showKinds
    .map(k => `<div class="legend-item">
      <span class="legend-dot" style="background:${HL_COLORS[k].fillSoft};border-color:${HL_COLORS[k].stroke}"></span>
      ${LEGEND[k]}
    </div>`).join('');
  if (getUrlParams().hidelegend) legend.style.display = 'none';
}

// ===== 动画主循环 =====
function frame(ts) {
  draw(ts);
  requestAnimationFrame(frame);
}

// ===== 播放控制 =====
function stepDur() { return 1500 / S.speed; }
function play() {
  if (S.playing) return;
  if (S.currentStep >= S.steps.length - 1) applyStep(0);
  S.playing = true;
  $('playBtn').innerHTML = '&#10074;&#10074;';
  tick();
}
function tick() {
  if (!S.playing) return;
  if (S.currentStep >= S.steps.length - 1) { pause(); return; }
  S.timer = setTimeout(() => {
    applyStep(S.currentStep + 1);
    tick();
  }, stepDur());
}
function pause() {
  S.playing = false;
  if (S.timer) { clearTimeout(S.timer); S.timer = null; }
  $('playBtn').innerHTML = '&#9654;';
}
function stepTo(idx) {
  pause();
  applyStep(clamp(idx, 0, S.steps.length - 1));
}

// ===== 加载预设 =====
function loadPreset(idx) {
  pause();
  S.presetIdx = idx;
  const preset = IR.presets[idx];
  if (IR.struct_type === 'mindmap') {
    // 思维导图没有步骤，使用伪步骤
    S.steps = [{ title: preset.name || IR.meta.title, desc: '' }];
  } else {
    S.steps = preset.steps;
  }
  S.currentStep = -1;
  S.display = {};
  S.nowT = null;
  if (IR.struct_type === 'mindmap') S.collapsed = new Set();
  const sel = $('presetSelect');
  if (sel && parseInt(sel.value, 10) !== idx) sel.value = String(idx);
  // 思维导图隐藏步骤导航
  if (IR.struct_type === 'mindmap') {
    $('prevBtn').style.display = 'none';
    $('nextBtn').style.display = 'none';
    $('playBtn').style.display = 'none';
    $('overlayNum').style.display = 'none';
    $('speedSlider').parentElement.style.display = 'none';
  }
  applyStep(0);
}

// ===== 初始化 =====
function init() {
  const params = getUrlParams();
  $('title').textContent = IR.meta.title;
  if (IR.meta.caption) {
    $('title').innerHTML += `<span style="font-weight:400;color:var(--text-2);margin-left:8px;font-size:12px">${IR.meta.caption}</span>`;
  }
  // 预设下拉
  const sel = $('presetSelect');
  IR.presets.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => loadPreset(parseInt(e.target.value, 10)));
  // 按钮
  $('resetBtn').onclick = () => { pause(); applyStep(0); };
  $('prevBtn').onclick = () => stepTo(S.currentStep - 1);
  $('nextBtn').onclick = () => stepTo(S.currentStep + 1);
  $('playBtn').onclick = () => S.playing ? pause() : play();
  // 速度
  const slider = $('speedSlider'), val = $('speedValue');
  slider.value = params.speed || 0.5;
  S.speed = parseFloat(slider.value);
  val.textContent = S.speed + 'x';
  slider.addEventListener('input', () => {
    S.speed = parseFloat(slider.value);
    val.textContent = S.speed + 'x';
  });
  // 键盘
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') stepTo(S.currentStep - 1);
    else if (e.key === 'ArrowRight') stepTo(S.currentStep + 1);
    else if (e.key === ' ') { e.preventDefault(); S.playing ? pause() : play(); }
    else if (e.key === 'r' || e.key === 'R') { pause(); applyStep(0); }
  });
  // 图例
  renderLegend();
  // 画布
  resizeCanvas();
  // 思维导图：点击节点折叠/展开
  if (IR.struct_type === 'mindmap') {
    canvas.style.cursor = 'pointer';
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      if (!S.layout) return;
      for (const n of S.layout.nodes) {
        const d = S.display[n.id];
        if (!d) continue;
        const dx = x - d.x, dy = y - d.y;
        if (dx*dx + dy*dy <= (d.r + 4) * (d.r + 4)) {
          if (n.hasChildren) {
            if (S.collapsed.has(n.id)) S.collapsed.delete(n.id);
            else S.collapsed.add(n.id);
            applyStep(S.currentStep);
          }
          return;
        }
      }
    });
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      let found = null;
      if (S.layout) {
        for (const n of S.layout.nodes) {
          const d = S.display[n.id];
          if (!d) continue;
          const dx = x - d.x, dy = y - d.y;
          if (dx*dx + dy*dy <= (d.r + 4) * (d.r + 4)) { found = n; break; }
        }
      }
      S.hoverNode = found;
      canvas.style.cursor = found && found.hasChildren ? 'pointer' : (found ? 'help' : 'default');
    });
  }
  // 选预设
  const pIdx = (params.preset != null && params.preset >= 0 && params.preset < IR.presets.length)
    ? params.preset : 0;
  loadPreset(pIdx);
  // 自动播放
  if (params.autoplay) setTimeout(play, 400);
  // 动画循环
  requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
